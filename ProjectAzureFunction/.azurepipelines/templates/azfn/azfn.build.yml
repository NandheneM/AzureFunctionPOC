parameters:
  - name: whitesourceScan
    displayName: "Whitesource Scan"
    type: boolean
    default: false
  - name: checkmarxScan
    displayName: "Checkmarx Scan"
    type: boolean
    default: false
  - name: unitTest
    displayName: "Unit Tests"
    type: boolean
    default: false

jobs:
  # Build Function --- START
  - ${{ if in(variables['Build.Reason'],'IndividualCI','BatchedCI','Manual', 'PullRequest') }}:
      - job: buildAzFn
        timeoutInMinutes: 360
        displayName: "Build AppName Azure Function"
        steps:
          - script: echo "Build Reason $(Build.Reason) ($(Build.SourceBranchName)) "

          ### Restore Packages
          - task: DotNetCoreCLI@2
            displayName: ".Net Core - Restore API"
            inputs:
              command: "restore"
              projects: "src/azfn/AppName.AzureFunction.sln"
              feedsToUse: "config"
              nugetConfigPath: src/azfn/NuGet.config

          #Nuget & Build Azure Function
          - task: DotNetCoreCLI@2
            displayName: ".Net Core - Build Azure Function"
            inputs:
              command: "build"
              projects: "src/azfn/*/*.csproj"
              arguments: "--configuration $(BuildConfiguration)"

          #Security Scan
          - ${{ if eq(parameters.whitesourceScan, true) }}:
              - task: replacetokens@3
                displayName: "Replace tokens in wss-unified-agent.config"
                inputs:
                  rootDirectory: $(whitesourceSolutionDirectory)
                  targetFiles: wss-unified-agent.config
                  verbosity: "detailed"

              - task: CmdLine@2
                displayName: "Whitesource Scan"
                inputs:
                  script: |
                    curl -LJO https://github.com/whitesource/unified-agent-distribution/releases/latest/download/wss-unified-agent.jar
                    java -jar wss-unified-agent.jar -c $(whitesourceSolutionDirectory)/wss-unified-agent.config -apiKey "$(whitesource.apiKey)" -userKey "$(whitesource.userKey)"

          #######################################
          ###CheckMarx Scan
          #######################################
          - ${{ if eq(parameters.checkmarxScan, true) }}:
              - task: checkmarx.cxsast.cx-scan-task.Application security testing@2020
                displayName: "Checkmarx Scan"
                inputs:
                  projectName: appname-azfn
                  CheckmarxService: "Checkmarx-AppName"
                  enableProxy: false
                  enableSastScan: true
                  customPreset: EY-Recommended
                  overrideProjectSettings: true
                  incScan: false
                  folderExclusion: "_cvs, .svn, _svn, .hg, .git, .bzr, .gitgnore, .gradle, .checkstyle, .classpath, bin, obj, backup, .idea, node_modules, .github, .mvn, .nuget, .nyc_output, .python_packages, .settings, .templates, .vs, .vscode, @angular, @angular-devkit, *bootstrap*, __mock__, __mocks__, __tests__, _deploysql, _examples, _generated, _pytest, _test_, _vendor, _vendored_packages, 05.testdata, 16.5_enabler react to webapi - uploaded files, 4qcx5vp2a0pbczjic2tlvs3qj, 99.examples, build, build-cache-1, builder, *tests, dashboard-deployment*, debug, deploy, deployment*, deploy-templates, dist, dists, docs, doctemplates, e2e, entityframework.*, *test, gradle-*, *jquery*, maven*, microsoft.*, mock, mockdata, mocks, modernizr.*, mstest.*, project-cache, react, sampledata, samples, software-deploy*, swagger*, system.diagnostics*, target, testatominstance, unit-test-data, unittestprojectcosmos, unity, unity.*, net35-unity.*, vendor, vendor-details, vendorfilter, wixsharp.*, z.entityframework.*, avscan, angular, *testing*, packages*, Checkmarx/Reports, Coverage, coverage, CodeCoverage, nodemon-server, src/ui, src/api, src/adf"
                  fileExtension: "!**/_cvs/**/*, !**/.svn/**/*, !**/.hg/**/*, !**/.git/**/*, !**/.bzr/**/*, !**/.gitgnore/**/*, !**/.gradle/**/*, !**/.checkstyle/**/*, !**/.classpath/**/*, !**/bin/**/*, !**/obj/**/*, !**/backup/**/*, !**/.idea/**/*, !**/*.DS_Store, !**/*.ipr, !**/*.iws, !**/*.bak, !**/*.tmp, !**/*.aac, !**/*.aif, !**/*.iff, !**/*.m3u, !**/*.mid, !**/*.mp3, !**/*.mpa, !**/*.ra, !**/*.wav, !**/*.wma, !**/*.3g2, !**/*.3gp, !**/*.asf, !**/*.asx, !**/*.avi, !**/*.flv, !**/*.mov, !**/*.mp4, !**/*.mpg, !**/*.rm, !**/*.swf, !**/*.vob, !**/*.wmv, !**/*.bmp, !**/*.gif, !**/*.jpg, !**/*.png, !**/*.psd, !**/*.tif, !**/*.swf, !**/*.jar, !**/*.zip, !**/*.rar, !**/*.exe, !**/*.dll, !**/*.pdb, !**/*.7z, !**/*.gz, !**/*.tar.gz, !**/*.tar, !**/*.gz, !**/*.ahtm, !**/*.ahtml, !**/*.fhtml, !**/*.hdm, !**/*.hdml, !**/*.hsql, !**/*.ht, !**/*.hta, !**/*.htc, !**/*.htd, !**/*.war, !**/*.ear, !**/*.htmls, !**/*.ihtml, !**/*.mht, !**/*.mhtm, !**/*.mhtml, !**/*.ssi, !**/*.stm, !**/*.bin,!**/*.lock,!**/*.svg,!**/*.obj, !**/*.stml, !**/*.ttml, !**/*.txn, !**/*.xhtm, !**/*.xhtml, !**/*.class, !**/*.iml, !Checkmarx/Reports/*.*, !OSADependencies.json, !**/node_modules/**/*, !**/*.dll, !**/*.config, !**/*.gradle, !**/*.jar, !**/*.json, !**/*.properties, !**/*.xml, !**/.github/**/*, !**/.mvn/**/*, !**/.nuget, !**/.nyc_output, !**/.python_packages, !**/.settings, !**/.templates, !**/.vs, !**/.vscode, !**/@angular, !**/@angular-devkit, !**/*bootstrap*, !**/__mock__, !**/__mocks__, !**/__tests__, !**/_deploysql, !**/_examples, !**/_generated, !**/_pytest, !**/_test_, !**/_vendor, !**/_vendored_packages, !**/05.testdata, !**/16.5_enabler react to webapi - uploaded files, !**/4qcx5vp2a0pbczjic2tlvs3qj, !**/99.examples, !**/bin !**/build, !**/build-cache-1, !**/builder, !**/*tests, !**/dashboard-deployment*, !**/debug, !**/deploy, !**/deployment*, !**/deploy-templates, !**/dist, !**/dists, !**/docs, !**/doctemplates, !**/e2e, !**/entityframework.*, !**/*test, !**/gradle-*, !**/*jquery*, !**/maven*, !**/microsoft.*, !**/mock, !**/mockdata, !**/mocks, !**/modernizr.*, !**/mstest.*, !**/node_modules, !**/project-cache, !**/react, !**/sampledata, !**/samples, !**/software-deploy*, !**/swagger*, !**/system.diagnostics*, !**/target, !**/testatominstance, !**/unit-test-data, !**/unittestprojectcosmos, !**/unity, !**/unity.*, !**/net35-unity.*, !**/vendor, !**/vendor-details, !**/vendorfilter, !**/wixsharp.*, !**/z.entityframework.*, !**/avscan, !**/node_modules/**/*, !**/angular/**/*, !**/*testing*, !**/packages*"
                  enableDependencyScan: false
                  fullTeamName: 'CxServer\SP\EY\Service Lines\Tax'

          #Publish artifacts
          - task: DotNetCoreCLI@2
            displayName: ".Net Core - Publish"
            inputs:
              command: "publish"
              publishWebProjects: false
              projects: "src/azfn/*/*.csproj"
              arguments: "--configuration $(BuildConfiguration) --output $(Build.ArtifactStagingDirectory)"

          - task: PublishBuildArtifacts@1
            displayName: "Publish Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "appname_azfn_drop"
              publishLocation: "Container"
